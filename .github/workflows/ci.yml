name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev libfontconfig1-dev libx11-dev libdbus-1-dev shellcheck
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      - name: Shellcheck
        run: shellcheck -S error install.sh uninstall.sh test-e2e.sh scripts/*.sh
